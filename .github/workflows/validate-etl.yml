name: Validate ETL

on:
  pull_request:
    paths:
      - 'data/**'
      - 'etl/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate-etl.yml'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete ETL validation
        run: |
          python etl/analis_de_dados.py
          python etl/cobertura_municipal.py
          python etl/analise_idhm_repasses.py
      - name: Test generated artifacts and SQLite schema
        run: python -m unittest discover -s tests -v
